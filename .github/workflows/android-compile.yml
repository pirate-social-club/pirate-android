name: android-compile

on:
  pull_request:
    paths:
      - ".github/workflows/android-compile.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
  push:
    paths:
      - ".github/workflows/android-compile.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      API_BASE_URL: https://api.pirate.sc
      PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
      PRIVY_APP_CLIENT_ID: ${{ secrets.PRIVY_APP_CLIENT_ID }}
      REOWN_PROJECT_ID: 08db15bf8bdb09d1cbc714f4c39d11a8
      REOWN_REDIRECT_URI: pirate://wallet-connect
      VERY_SDK_KEY: ${{ secrets.VERY_SDK_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile debug Kotlin
        run: ./gradlew --no-daemon --console=plain :app:compileDebugKotlin
