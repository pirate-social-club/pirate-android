name: Build Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build staging debug
        run: ./gradlew assembleStagingDebug

      - name: Build production release
        run: ./gradlew assembleProductionRelease

      - name: Upload staging debug APK
        uses: actions/upload-artifact@v4
        with:
          name: staging-debug
          path: app/build/outputs/apk/staging/debug/

      - name: Upload production release APK
        uses: actions/upload-artifact@v4
        with:
          name: production-release
          path: app/build/outputs/apk/production/release/
