name: android-release-bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      API_BASE_URL: https://api.pirate.sc
      PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
      PRIVY_APP_CLIENT_ID: ${{ secrets.PRIVY_APP_CLIENT_ID }}
      REOWN_PROJECT_ID: 08db15bf8bdb09d1cbc714f4c39d11a8
      REOWN_REDIRECT_URI: pirate://wallet-connect
      VERY_SDK_KEY: ${{ secrets.VERY_SDK_KEY }}
      PIRATE_ANDROID_SLOW: "1"
      PIRATE_ANDROID_MAX_WORKERS: "1"
      GRADLE_OPTS: "-Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1 -Dorg.gradle.priority=low"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and Android lint
        run: ./scripts/androidw.sh --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug

      - name: Validate signing secrets
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_FILE_B64: ${{ secrets.SIGNING_STORE_FILE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          missing=0
          for secret_name in SIGNING_STORE_FILE_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required signing secret: $secret_name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Release signing is not configured correctly."
            exit 1
          fi
        shell: bash

      - name: Decode signing keystore
        env:
          SIGNING_STORE_FILE_B64: ${{ secrets.SIGNING_STORE_FILE }}
        run: echo "$SIGNING_STORE_FILE_B64" | base64 --decode > "$RUNNER_TEMP/pirate-upload.jks"
        shell: bash

      - name: Create signing.properties
        run: |
          echo "storeFile=$RUNNER_TEMP/pirate-upload.jks" > signing.properties
          echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" >> signing.properties
          echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> signing.properties
          echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> signing.properties
        shell: bash

      - name: Build release bundle
        run: ./scripts/androidw.sh --no-daemon --console=plain :app:bundleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Build release APK
        run: ./scripts/androidw.sh --no-daemon --console=plain :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
