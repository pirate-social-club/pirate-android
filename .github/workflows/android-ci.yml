name: android-ci

on:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-release-apk.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-release-apk.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      API_BASE_URL: https://api-staging.pirate.sc
      WEB_BASE_URL: https://staging.pirate.sc
      PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
      PRIVY_APP_CLIENT_ID: ${{ secrets.PRIVY_APP_CLIENT_ID }}
      REOWN_PROJECT_ID: 08db15bf8bdb09d1cbc714f4c39d11a8
      REOWN_REDIRECT_URI: pirate://wallet-connect
      VERY_SDK_KEY: ${{ secrets.VERY_SDK_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

      - name: Run debug and release unit tests
        run: ./scripts/androidw.sh --no-daemon --console=plain :app:testDebugUnitTest :app:testReleaseUnitTest

      - name: Run Android lint
        run: ./scripts/androidw.sh --no-daemon --console=plain :app:lintDebug

      - name: Build debug
        run: ./scripts/androidw.sh --no-daemon --console=plain :app:assembleDebug

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/tests/testReleaseUnitTest/
            app/build/reports/lint-results-debug.html
            app/lint-baseline.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/
          retention-days: 7
