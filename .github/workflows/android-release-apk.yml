name: android-release-apk

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    uses: ./.github/workflows/android-ci.yml
    secrets: inherit

  apk:
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: production
    env:
      API_BASE_URL: https://api.pirate.sc
      WEB_BASE_URL: https://pirate.sc
      PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
      PRIVY_APP_CLIENT_ID: ${{ secrets.PRIVY_APP_CLIENT_ID }}
      REOWN_PROJECT_ID: 08db15bf8bdb09d1cbc714f4c39d11a8
      REOWN_REDIRECT_URI: pirate://wallet-connect
      VERY_SDK_KEY: ${{ secrets.VERY_SDK_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate release runtime configuration
        run: |
          for config_name in PRIVY_APP_ID PRIVY_APP_CLIENT_ID VERY_SDK_KEY; do
            if [ -z "${!config_name}" ]; then
              echo "Missing required release configuration: $config_name"
              exit 1
            fi
          done
        shell: bash

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

      - name: Validate signing secrets
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_FILE_B64: ${{ secrets.SIGNING_STORE_FILE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          missing=0
          for secret_name in SIGNING_STORE_FILE_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required signing secret: $secret_name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Release signing is not configured correctly."
            exit 1
          fi
        shell: bash

      - name: Decode signing keystore
        env:
          SIGNING_STORE_FILE_B64: ${{ secrets.SIGNING_STORE_FILE }}
        run: echo "$SIGNING_STORE_FILE_B64" | base64 --decode > "$RUNNER_TEMP/pirate-upload.jks"
        shell: bash

      - name: Create signing.properties
        run: |
          echo "storeFile=$RUNNER_TEMP/pirate-upload.jks" > signing.properties
          echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" >> signing.properties
          echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> signing.properties
          echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> signing.properties
        shell: bash

      - name: Build release APK
        run: ./scripts/androidw.sh --no-daemon --console=plain :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
